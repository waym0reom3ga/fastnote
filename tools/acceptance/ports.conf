# FastNote acceptance harness — port manifest
#
# One record per port. Fields are colon-separated:
#
#   dir : build_command : binary_path : ui_source_glob : ui_click_test_command
#
#   dir                    directory name under editions/
#   build_command          single command producing the binary, run from inside dir
#   binary_path            path to the built artifact, relative to dir
#   ui_source_glob         space-separated globs holding the GUI code, for A6/A7/A11
#   ui_click_test_command  command running the port's real pointer-event tests (A13).
#                          Use "-" only to declare that the port has none, which fails A13.
#
# The last field is the one that matters most. Everything else can be satisfied by a port
# whose buttons do nothing: the CLI seam exercises the logic, not the interface. A13 is the
# only test that presses the button.
#
# A port absent from this file has not been started. A port present here is claiming to
# implement the specification and is held to all thirteen acceptance tests.

fastnote_go_gio_ed   : make                              : fastnote-gio                     : *.go                             : go test -count=1 -run TestUI .
fastnote_go_fyne_ed  : make                              : fastnotes                        : *.go                            : go test -count=1 -run TestUI .
fastnote_c_nuklear_ed: make                     : fastnote_c_nuklear               : src/app_ui.c src/app.c src/main.c src/actions.c src/file_browser.c src/renderer.c : make test-ui
fastnote_c_gtk4_ed   : make                              : fastnote_c_gtk4                   : src/main.c src/app.c src/ui.c src/file_browser.c src/actions.c : make test-ui
fastnote_c_raygui_ed : make                      : fastnote_c_raygui                 : src/app.c : make test-ui
fastnote_rust_gtk4_ed: RUSTC_WRAPPER=sccache cargo build --release      : target/release/fastnote-gtk4     : src/*.rs : cargo test --release --test ui_click
fastnote_rust_egui_ed: RUSTC_WRAPPER=sccache cargo build --release      : target/release/fastnote-egui     : src/*.rs : cargo test --release --test ui_click
fastnote_rust_slint_ed: RUSTC_WRAPPER=sccache cargo build --release     : target/release/fastnote-slint    : src/*.rs src/*.slint : cargo test --release --test ui_click
fastnote_python_gtk4_ed     : true : run.sh : src/*.py : python3 -m pytest tests/test_ui_click.py -q
fastnote_python_pyqt6_ed    : true : run.sh : src/*.py : python3 -m pytest tests/test_ui_click.py -q
fastnote_python_pyside6_ed  : true : run.sh : src/*.py : python3 -m pytest tests/test_ui_click.py -q
fastnote_python_dearpygui_ed: true : run.sh : src/*.py : ./.venv/bin/python -m pytest tests/test_ui_click.py -q
